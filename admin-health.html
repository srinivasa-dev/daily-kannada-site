<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin health dashboard for Daily Kannada API." />
  <title>API Health | Daily Kannada</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Daily Kannada</a>
      <nav class="nav-links" aria-label="Admin navigation">
        <a href="admin.html">Phrases</a>
        <a href="admin-health.html" aria-current="page">API Health</a>
        <span id="admin-user" class="nav-text"></span>
        <button id="logout-button" class="nav-button" type="button">Logout</button>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container admin-page-container admin-layout">
      <section class="card admin-hero health-hero">
        <p class="eyebrow">Operations</p>
        <h1>API Health Dashboard</h1>
        <p class="subtitle">Track service status, dependency checks, core metrics, and current response time from one screen.</p>
      </section>

      <section class="card toolbar-card">
        <div class="toolbar">
          <div>
            <h2>Service Snapshot</h2>
          </div>
          <div class="toolbar-actions">
            <p id="health-last-updated" class="toolbar-note">Waiting for first response...</p>
            <button id="refresh-health-button" class="button button-alt" type="button">Refresh</button>
          </div>
        </div>
        <p id="health-message" class="status-message" aria-live="polite"></p>
      </section>

      <section id="health-root" class="health-layout" aria-live="polite"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>&copy; 2026 Daily Kannada</p>
    </div>
  </footer>
  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/admin-health.js"></script>
</body>
</html>

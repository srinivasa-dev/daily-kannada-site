<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Reset your Daily Kannada account password using the secure link sent to your email."
  />
  <title>Reset Password | Daily Kannada</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <main class="section reset-page">
    <div class="container auth-shell">
      <section class="auth-card reset-card">
        <p class="eyebrow">Account Recovery</p>
        <h1>Reset Password</h1>
        <p class="subtitle">Choose a new password for your Daily Kannada account.</p>
        <p id="token-notice" class="token-notice" aria-live="polite"></p>

        <form id="reset-password-form" class="auth-form" novalidate>
          <label class="field">
            <span>New Password</span>
            <div class="password-field">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
              <button
                class="password-toggle"
                type="button"
                data-target="password"
                aria-label="Show new password"
                aria-pressed="false"
              >
                <span class="password-toggle-icon" aria-hidden="true">◉</span>
              </button>
            </div>
          </label>

          <label class="field">
            <span>Confirm Password</span>
            <div class="password-field">
              <input
                id="confirm-password"
                name="confirm-password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
              <button
                class="password-toggle"
                type="button"
                data-target="confirm-password"
                aria-label="Show confirm password"
                aria-pressed="false"
              >
                <span class="password-toggle-icon" aria-hidden="true">◉</span>
              </button>
            </div>
          </label>

          <p class="form-hint">Use at least 6 characters.</p>
          <p id="reset-password-message" class="status-message" aria-live="polite"></p>

          <div class="button-row">
            <button id="reset-password-submit" class="button" type="submit">Reset Password</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/reset-password.js"></script>
</body>
</html>

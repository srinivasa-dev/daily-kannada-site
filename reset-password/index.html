<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Reset your Daily Kannada account password using the secure link sent to your email."
  />
  <title>Reset Password | Daily Kannada</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <main class="section reset-page">
    <div class="container auth-shell">
      <section class="auth-card reset-card">
        <p class="eyebrow">Account Recovery</p>
        <h1>Reset Password</h1>
        <p class="subtitle">Choose a new password for your Daily Kannada account.</p>
        <p id="token-notice" class="token-notice" aria-live="polite"></p>

        <form id="reset-password-form" class="auth-form" novalidate>
          <label class="field">
            <span>New Password</span>
            <div class="password-field">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
              <button
                class="password-toggle"
                type="button"
                data-target="password"
                aria-label="Show new password"
                aria-pressed="false"
              >
                <svg
                  class="password-toggle-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    class="eye-open"
                    d="M1.5 12s3.8-6.5 10.5-6.5S22.5 12 22.5 12 18.7 18.5 12 18.5 1.5 12 1.5 12Z"
                  />
                  <circle class="eye-open" cx="12" cy="12" r="3.25" />
                  <path
                    class="eye-closed"
                    d="M3 4.5 20 19.5M9.9 9.5a3.2 3.2 0 0 0 4.6 4.2M6.2 7.3C3.7 9.2 2.3 12 2.3 12s3.8 6.5 10.5 6.5c2 0 3.8-.6 5.3-1.5M10.2 5.7c.6-.1 1.2-.2 1.8-.2 6.7 0 10.5 6.5 10.5 6.5s-1.2 2.1-3.4 4.1"
                  />
                </svg>
              </button>
            </div>
          </label>

          <label class="field">
            <span>Confirm Password</span>
            <div class="password-field">
              <input
                id="confirm-password"
                name="confirm-password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
              <button
                class="password-toggle"
                type="button"
                data-target="confirm-password"
                aria-label="Show confirm password"
                aria-pressed="false"
              >
                <svg
                  class="password-toggle-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    class="eye-open"
                    d="M1.5 12s3.8-6.5 10.5-6.5S22.5 12 22.5 12 18.7 18.5 12 18.5 1.5 12 1.5 12Z"
                  />
                  <circle class="eye-open" cx="12" cy="12" r="3.25" />
                  <path
                    class="eye-closed"
                    d="M3 4.5 20 19.5M9.9 9.5a3.2 3.2 0 0 0 4.6 4.2M6.2 7.3C3.7 9.2 2.3 12 2.3 12s3.8 6.5 10.5 6.5c2 0 3.8-.6 5.3-1.5M10.2 5.7c.6-.1 1.2-.2 1.8-.2 6.7 0 10.5 6.5 10.5 6.5s-1.2 2.1-3.4 4.1"
                  />
                </svg>
              </button>
            </div>
          </label>

          <p class="form-hint">Use at least 6 characters.</p>
          <p id="reset-password-message" class="status-message" aria-live="polite"></p>

          <div class="button-row">
            <button id="reset-password-submit" class="button" type="submit">Reset Password</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/reset-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin login for Daily Kannada phrase management." />
  <title>Admin Login | Daily Kannada</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Daily Kannada</a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="privacy.html">Privacy Policy</a>
        <a href="delete-account.html">Delete Data Policy</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Admin</p>
        <h1>Secure Login</h1>
        <p class="subtitle">Sign in with an admin account to manage Daily Kannada phrases.</p>
        <form id="login-form" class="auth-form" novalidate>
          <label class="field">
            <span>Email</span>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <p id="login-message" class="status-message" aria-live="polite"></p>
          <div class="button-row">
            <button id="login-submit" class="button" type="submit">Sign In</button>
            <a class="button button-alt" href="index.html">Back to site</a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>&copy; 2026 Daily Kannada</p>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
